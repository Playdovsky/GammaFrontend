# This workflow is a complete CI/CD to GCP pipeline
# it will install Node.js dependencies, lint code, perform security check, run tests
# after steps above went successfully it will then authenticate to GCP, build an image and push it to GCP Artifact Registry
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI/CD pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: "europe-central2"
  GCP_PROJECT_ID: "project-8f2122a5-c322-493d-a58"
  AR_URI: "europe-central2-docker.pkg.dev" 
  AR_REPOSITORY: "gamma" 
  IMAGE_NAME: "gamma-frontend"
  CR_SERVICE: "gamma-frontend"

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
    - name: Install dependencies
      run: | 
        npm ci
    - name: Lint with eslint
      run: |
        npx eslint .
    - name: Security audit with npm-audit
      run: |
        npm audit
    - name: Test with vitest
      run: |
        npx vitest run
    - name: Authenticate to GCP
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: ${{ secrets.GCP_WIP }}
        service_account: ${{ secrets.GCP_SA }}
    - name: Log in to GCP Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GCP_REGION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}
    - name: Build Docker image
      run: |
        docker build -t ${{ env.AR_URI }}/${{ env.GCP_PROJECT_ID }}/${{env.AR_REPOSITORY}}/${{ env.IMAGE_NAME }}:${{ github.sha }} ./
    - name: Push Docker image
      if: github.event_name == 'push'
      run: |
        docker push "${{ env.AR_URI }}/${{ env.GCP_PROJECT_ID }}/${{env.AR_REPOSITORY}}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  continuous-deployment:
    name: Continuous Deployment
    needs: continuous-integration
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WIP }}
          service_account: ${{ secrets.GCP_SA }}
      - name: Deploy to Cloud run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CR_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: "${{ env.AR_URI }}/${{ env.GCP_PROJECT_ID }}/${{env.AR_REPOSITORY}}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
